; ----------------------------------------------------------------------------------------
; ESP32 versions
; ----------------------------------------------------------------------------------------
;
; Wireless-Tag WT32-SC01 (Seeed Studio 4735)
;   PCB    : WT32-SC01_V3.2 (2021)
;   MCU    : ESP32-WROVER-B, 240MHz, 4MB flash, 8MB PSRAM (QSPI)
;   LCD    : 3.5" 480x320, ST7796S controller, SPI (HSPI), write only (no reads)
;   Touch  : capacitive, 2 point, FT6336U controller, I2C address 0x38
;   Docs   : docs/WT32-SC01-datasheet.pdf
;
;   Display SPI (HSPI)          Touch (I2C)                    Other
;   -------------               -----------                    -----
;   SCLK 14  LCD_SCL            SDA 18  I2C_SDA (R14 10K up)    EM_INT 36 (EM20918,
;   MOSI 13  LCD_SDA            SCL 19  I2C_SCL (R13 10K up)     SMT-NC, not mounted)
;   CS   15  LCD_CS             INT 39  TP_INT (R18 0R to
;   DC   21  LCD_RS                     SENSOR_VN = IO39)
;   RST  22  LCD_REST            touch RST is tied to GND
;   BL   23  LCD_LED
;   MISO is NOT connected: LCD_RD (LCM pin 10) and DB0..DB7 (LCM pin 12-19) are
;        unused, IM1/IM2 = 1 selects the SPI interface -> the panel is write only.
;   IO14/IO13/IO15/IO21/IO22/IO23 reach the LCM through 0R series resistors and
;   IO18/IO19 are the shared I2C bus (touch + EM20918).
;

[wt32_sc01_base_esp32]
extends = debug_esp32

; ESP32-WROVER-B -> qio flash + qspi psram (selects the SPIRAM enabled SDK variant)
board_build.arduino.memory_type = qio_qspi

build_src_filter =
    ${debug_esp32.build_src_filter}
    +<../src/plugins/alarm/>
    +<../src/plugins/lvgl/>
    +<../src/plugins/lvgl/devices/wt32_sc01/>

lib_ignore =
    ${debug_esp32.lib_ignore}
    Adafruit-ST7735-Library
    Adafruit-GFX-Library
    Adafruit ST7735 and ST7789 Library
    Adafruit STMPE610
    Adafruit ILI9341
    Adafruit TouchScreen
    KFCGfx
    KFCOpenWeather
    KFCRestApi

lib_deps =
    ${debug_esp32.lib_deps}
    lovyan03/LovyanGFX@^1.2.30
    lvgl/lvgl@^8.4.0

build_unflags =
    ${debug_esp32.build_unflags}

build_flags =
    ${debug_esp32.build_flags}
    ; --- WT32-SC01 board pinout (see header of this file)
    ; LCD/TFT, ST7796S over HSPI
    -D IOT_WT32_SC01_PIN_TFT_SCLK=14
    -D IOT_WT32_SC01_PIN_TFT_MOSI=13
    -D IOT_WT32_SC01_PIN_TFT_MISO=-1 ; not connected, the panel is write only
    -D IOT_WT32_SC01_PIN_TFT_CS=15
    -D IOT_WT32_SC01_PIN_TFT_DC=21
    -D IOT_WT32_SC01_PIN_TFT_RST=22
    -D IOT_WT32_SC01_PIN_TFT_BL=23
    -D IOT_WT32_SC01_TFT_WIDTH=480
    -D IOT_WT32_SC01_TFT_HEIGHT=320
    -D IOT_WT32_SC01_TFT_BL_ACTIVE_HIGH=1
    ; panel write clock, HSPI max is 80MHz
    ; 27MHz = TFT_eSPI Setup201, 40MHz = LovyanGFX detector, 80MHz = max
    -D IOT_WT32_SC01_TFT_SPI_FREQUENCY=80000000
    ; touch controller FT6336U, I2C
    -D IOT_WT32_SC01_PIN_TOUCH_SDA=18
    -D IOT_WT32_SC01_PIN_TOUCH_SCL=19
    -D IOT_WT32_SC01_PIN_TOUCH_INT=39 ; input only
    -D IOT_WT32_SC01_TOUCH_I2C_ADDRESS=0x38      ; 7 bit address
    -D IOT_WT32_SC01_TOUCH_POINTS=2
    ; the WT32-SC01 has no user controllable LED (power/TX/RX LEDs are hardwired)
    -D __LED_BUILTIN=IGNORE_BUILTIN_LED_PIN_ID
    -D INVERT_BUILTIN_LED=0
    ; --- PSRAM, 8MB QSPI on the ESP32-WROVER-B
    ; BOARD_HAS_PSRAM is required: the Arduino core undefines CONFIG_SPIRAM without it
    ; (esp32-hal-psram.h). The -mfix flags are the ESP32 rev1 PSRAM cache workaround
    ; (same as the official WROVER board definitions); drop them on rev3 silicon.
    -D BOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    ; --- LVGL 8.4 (lv_conf.h lives in the device folder)
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I./src/plugins/lvgl/devices/wt32_sc01
    ; --- LVGL display plugin (src/plugins/lvgl)
    -D IOT_LVGL_SUPPORT=1
    -D DEBUG_LVGL=1
    -D DEBUG_WT32_SC01=1
    ; --- application
    -D MQTT_AUTO_DISCOVERY_MODEL=\"WT32-SC01\ Display\ ESP32\"
    -D AT_MODE_SUPPORTED=1
    -D IOT_ALARM_PLUGIN_ENABLED=1
    -D IOT_ALARM_PLUGIN_HAS_BUZZER=0
    -D IOT_ALARM_PLUGIN_HAS_SILENT=1
    -D IOT_ALARM_PLUGIN_DEFAULT_MAX_DURATION=300
    -D IOT_CLOCK_ALARM_COLOR=0x330000   ; red @ ~20% brightness
    -D RTC_SUPPORT=0
    -D NTP_HAVE_CALLBACKS=1

[env:wt32_sc01_test1]
extends = wt32_sc01_base_esp32

upload_protocol = esptool
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
