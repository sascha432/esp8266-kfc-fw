; -------------------------------------------------------------------------
; Author: sascha_lammers@gmx.de
; -------------------------------------------------------------------------
; Shared third-party libraries
;
; One section per library, an environment references it with
; ${<section>.lib_deps} instead of repeating the URL (or the registry name).
; The LED libraries (FastLED, NeoPixelEx, NeoPixelBus) are in
; conf/envs/led_matrix.ini - only the clock/LED matrix plugin uses them.
;
; Keep in mind: a dependency that an env needs while its base ignores it has to
; stay visible in the env. conf/envs/weather_station.ini therefore keeps its own
; lib_ignore - the ESP8266/ESP32 base lists ignore "Adafruit GFX Library", which
; the weather station needs (src/plugins/weather_station/WSDraw.h ->
; Adafruit_GFX.h, [lib_adafruit_gfx] below).
; -------------------------------------------------------------------------

[lib_adafruit_gfx]
; fork, used by the LED matrix, the weather station and the WT32-SC01
lib_deps =
    https://github.com/sascha432/Adafruit-GFX-Library.git

[lib_arduino_interpolation]
; interpolated palettes/gradients of the clock plugin
lib_deps =
    https://github.com/sascha432/Arduino-Interpolation

[lib_arduino_fft]
; FFT of the audio visualizer (clock plugin)
lib_deps =
    https://github.com/kosme/arduinoFFT.git#v2.0.4

[lib_adafruit_sensor]
; registry name. The weather station pins Adafruit_Sensor 1.1.6 explicitly
; (https://github.com/adafruit/Adafruit_Sensor.git#1.1.6) and keeps that pin
lib_deps =
    Adafruit Unified Sensor

[lib_adafruit_bme280]
lib_deps =
    https://github.com/adafruit/Adafruit_BME280_Library.git#2.1.4

[lib_rtclib]
lib_deps =
    https://github.com/sascha432/RTClib.git

[lib_tjpg_decoder]
lib_deps =
    https://github.com/sascha432/TJpg_Decoder.git
